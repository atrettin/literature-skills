[pytest]
testpaths = tests

# The repository root, so `lit` imports from the working tree. Without it a
# clone that also has the package installed would test the installed copy.
pythonpath = .

# A test marked `network` calls a live API. arXiv asks for three seconds between
# calls, so a suite that hits it is slow, and it fails whenever the network
# does. Those tests guard the assumptions the query builder rests on, which
# change at arXiv rather than here, so they run when asked and not before:
#
#     .venv/bin/python -m pytest -m network
markers =
    network: calls a live API; deselected by default

addopts = -m "not network"
